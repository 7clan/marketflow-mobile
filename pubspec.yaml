name: marketflow
description: "MarketFlow — a marketplace shopping app (feed, search, cart, checkout, orders) built with Flutter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, followed by a +. For
# example, 1.2.43 or.1 is the version used by versionName while build-number is
# used as versionCode in Android, and build-name is used as CFBundleShortVersionString
# while build-number is used as versionCode in Android. For iOS, build-name is
# used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Learn more about Android/iOS versioning at https://developer.android.com/studio/publish/versioning
# and https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
#
# In Android, name and versionCode are properties you pass to this constructor.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that this package needs.
#
# Run `flutter pub add` to add packages from pub.dev or `dart pub add` for
# Flutter-aware packages. See the documentation on what the dependencies in the
# "dependencies" and "dev_dependencies" sections represent.
dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.11.1

  # Persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

  # Images
  cached_network_image: ^4.0.2

  # Misc
  intl: ^0.20.3

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint rules used by `flutter analyze`. Activated in analysis_options.yaml.
  flutter_lints: ^6.0.0

  # Mocking library used by the test suite.
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so the icons in the material Icons class
  # are available to use.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg

  # An image asset can refer to a resolution-specific "variant", see
  # https://flutter.dev/to/resolution-aware-images
