# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints. The issues identified by the analyzer
# are surfaced in the UI of Dart-enabled IDEs (https://dart.dev/tools#ides-and-editors).
# The analyzer can also be invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # `rules` section below to disable a lint rule from the included
  # `package:flutter_lints/flutter.yaml` or enable additional rules.
  # A list of all available lints and their documentation is
  # published at https://dart.dev/tools/lints.
  #
  # Instead of disabling a lint rule for the entire project in
  # the `linter` section below, it can also be suppressed for a single line of
  # code or a single file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` comments. Those can be used in place of
  # the `linter` section when a rule only needs to be relaxed in a single place.
  rules:
    # Every future must be explicitly awaited or marked with unawaited() —
    # silent fire-and-forget hides race conditions.
    - unawaited_futures

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
